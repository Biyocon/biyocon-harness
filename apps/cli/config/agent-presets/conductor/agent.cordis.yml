# The complete `conductor` agent preset. The parent receives the filesystem
# tools needed to inspect and record a run; every specialist receives a stricter
# stage policy from the Conductor runtime.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are The Conductor. Own workflow state and gate decisions, dispatch fresh specialists,
      and never treat a specialist self-report as release authority.
      Use the conductor tool for the requested specialist workflow. If it reports an error or
      blocker, report that result to the user and stop. Never replace a failed Conductor run
      by implementing the task yourself or by pretending that specialists or gates ran.

- id: instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: filesystem
  name: '@deepseek-ai/dsh-tool-fs'

- id: filesystem-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: default-skills
  name: '@deepseek-ai/dsh-skill-filesystem'

# Roles and protocols are installed assets, not workspace-provided skills.
# The private registry also prevents project/user skills shadowing these names.
- id: conductor-runtime
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
    skills: true
  config:
    - id: conductor-skills
      name: '@deepseek-ai/dsh-skill'
    - id: conductor-installed-skills
      name: '@deepseek-ai/dsh-conductor-presets'
      config:
        rolesDirectory: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/roles/', baseUrl))"
        protocolDirectory: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/protocols/', baseUrl))"
    - id: workflow-worker
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
    - id: tool-conductor
      name: '@deepseek-ai/dsh-tool-conductor'
      config:
        subagentProvider: spawn
        maxReworkCycles: 3
        maxRalphRounds: 3
        maxRalphHandoffChars: 16384
        qualityCommands: []
