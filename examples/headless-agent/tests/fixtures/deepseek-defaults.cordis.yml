- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: enabled
          reasoningEffort: low
          # The fixture's final payload arrives after this deadline; only its
          # SSE comments keep the stream alive. A missed comment fails this
          # scenario directly instead of becoming a duplicate retry request.
          streamIdleTimeoutMs: 2000
          retryPolicy:
            mode: normal
            maxRetries: 0
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
