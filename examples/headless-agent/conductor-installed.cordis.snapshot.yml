# The example's runtime with the real shipped Conductor preset mounted by its
# normal agent-preset service. Only the model adapter is deterministic.
- id: conductor-installed-mock
  name: ./tests/fixtures/conductor-installed-mock.ts

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: attachments
  name: '@deepseek-ai/dsh-attachment-local'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents: []
          workspaceContext: false
          skills:
            filesystem:
              agentsHome: ./.agents-home
          persona: Keyless Conductor installation snapshot.

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: conductor
    includeUserRoot: false
    roots:
      - path: !!js process.cwd() + '/installed-presets'
        trust: system
