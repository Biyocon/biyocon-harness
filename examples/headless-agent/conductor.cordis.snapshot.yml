# Replay composition for the Conductor closeout-authorization snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: tool-ralph
        name: '@deepseek-ai/dsh-tool-ralph'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
          - id: tool-conductor
            name: '@deepseek-ai/dsh-tool-conductor'
            config:
              subagentProvider: spawn
              maxReworkCycles: 3
              maxRalphRounds: 0
              maxRalphHandoffChars: 16384
